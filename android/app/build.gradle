plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def pubspecVersionName = flutter.versionName
def pubspecVersionCode = flutter.versionCode.toInteger()

android {
    namespace "com.paykaribazar.app"
    // CI runners ship Android Build Tools that match SDK 35; SDK 36 causes
    // "Build Tools API Version Mismatch Detected" on ubuntu-24.04 GitHub
    // Actions runners. Bump back to 36 ONLY after GitHub runners ship a
    // matching build-tools release (track
    // https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md).
    compileSdk 35
    ndkVersion = "27.2.12479018"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        // applicationId is defined dynamically in productFlavors
        minSdkVersion flutter.minSdkVersion // Updated to 23 as required by plugins (e.g., record_android, geolocator_android)
        targetSdk 35 // keep in sync with compileSdk above until CI runners support SDK 36
        versionCode pubspecVersionCode
        versionName pubspecVersionName

        // Large app — many payment / Firebase / Sentry deps exceed 64K methods.
        multiDexEnabled true

        def mapsKey = keystoreProperties['MAPS_API_KEY'] ?: "YOUR_API_KEY_HERE"
        manifestPlaceholders["MAPS_API_KEY"] = mapsKey
    }

    flavorDimensions "app"
    productFlavors {
        customer {
            dimension "app"
            applicationId "com.paykaribazar.customer"
            resValue "string", "app_name", "Paykari Bazar"
        }
        admin {
            dimension "app"
            applicationId "com.paykaribazar.admin"
            resValue "string", "app_name", "Paykari Bazar Admin"
        }
    }

    buildTypes {
        release {
            // PRODUCTION HARDENING: release builds MUST be signed with the
            // production keystore. Falling back to the debug signing key
            // would ship a debug-signed artifact to Play Store / end users,
            // breaking updates and leaking the debug key. Fail fast instead.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException("❌ Production release keystore missing. Define keystore.properties with storeFile/keyAlias/passwords before building a release. Debug signing is NOT allowed for production artifacts.")
            }

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug builds keep using the debug keystore — only used for
            // local development / CI emulator runs.
            signingConfig signingConfigs.debug
        }
    }
}

// Blueprint alignment: Force all Kotlin deps to 2.1.0
// This is the "wise" upgrade to match your modern dependencies while fixing the crash
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion "2.1.0"
        }
    }
}

flutter {
    source "../../"
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.firebase:firebase-appcheck-debug:18.0.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // multidex for large method count (payment SDKs + Firebase + Sentry)
    implementation "androidx.multidex:multidex:2.0.1"
}
