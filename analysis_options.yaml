include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unused_import: warning
    unused_local_variable: warning
    unused_element: warning
    dead_code: warning
    deprecated_member_use: info
    subtype_of_sealed_class: ignore
    unawaited_futures: error
    use_build_context_synchronously: error
    missing_required_param: error
    avoid_print: error
    prefer_const_constructors: error
    always_specify_types: info
    todo: ignore
    # Mockito-generated `.mocks.dart` files override generic methods
    # (`WriteBatch.update<T>(DocumentReference<T>, T)`, etc.) with the
    # non-generic signature the frozen Mockito 5.4.4 generator emits.
    # cloud_firestore 6.x tightens the base-class signature, which makes
    # the generated overrides invalid. The per-file `// ignore_for_file:
    # invalid_override, type_argument_not_callable` directives in
    # `test/**/*.mocks.dart` are the primary fix; this global `ignore`
    # is a safety net so a regenerated mock can't break CI before the
    # directive is re-added.
    invalid_override: ignore
    type_argument_not_callable: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "flutter/**"
    - "paykari_bazar/**"
    - "paykari_bazar_admin/**"

linter:
  rules:
    - avoid_print
    - prefer_single_quotes
    - curly_braces_in_flow_control_structures
    - always_declare_return_types
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_redundant_argument_values
    - avoid_unnecessary_containers
    - prefer_final_fields
    - prefer_final_locals
    - sized_box_for_whitespace
    - use_key_in_widget_constructors
