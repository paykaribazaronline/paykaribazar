name: Documentation - Update README, Changelog & API Docs

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'functions/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-24.04  # pinned — ubuntu-latest will migrate to Ubuntu 26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.35.0 ships Dart 3.9 — required by shared_preferences ^2.5.5
          channel: stable
          cache: true

      # ── Generate Release Notes ─────────────────────────────────────────
      - name: Generate Release Notes
        id: release_notes
        if: github.event_name == 'release'
        run: |
          VERSION=${{ github.event.release.tag_name || github.ref_name }}
          CHANGELOG=$(cat << 'EOF'
          ## [$(VERSION)] - $(date +%Y-%m-%d)

          ### 🎉 Features
          - Production trust boundary enforced via Cloud Functions
          - Real bKash / Nagad / SSLCommerz / Bank payment flows
          - Transactional inventory reservation with HMAC-signed pricing snapshots
          - Firestore / Storage rules emulator-tested on every PR

          ### 🔧 Improvements
          - CI is now a real quality gate (no `continue-on-error`)
          - Pinned every dependency in `pubspec.yaml`
          - Documentation under `docs/` covers architecture, security, payments, deployment, runbook

          ### 🐛 Bug Fixes
          - Fixed `Future.wait([settingsFuture])` → `results[1]` RangeError on signup
          - Removed client-side money calculation in OrderService
          - Removed client-side secrets from `security_initializer.dart`

          ### 📦 Deployment
          - **Shorebird OTA:** Automatic update enabled
          - **Firebase Hosting:** Web apps deployed
          - **Google Play:** Beta track (future)

          EOF
          )
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        if: github.event_name == 'release'
        run: |
          cat <(echo "${{ steps.release_notes.outputs.changelog }}") CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Update README with latest version
        if: github.event_name == 'release'
        run: |
          sed -i 's/Version: .*/Version: ${{ github.event.release.tag_name || github.ref_name }}/' README.md || true
          sed -i 's/Last Updated: .*/Last Updated: $(date -u +%Y-%m-%d)/' README.md || true

      # ── Build functions TypeScript API docs ─────────────────────────────
      - name: Install TypeDoc (functions API doc generator)
        run: |
          if [ -f functions/package.json ]; then
            (cd functions && npm install && npm install --no-save typedoc typescript)
          fi

      - name: Generate functions API docs
        run: |
          if [ -f functions/tsconfig.json ]; then
            (cd functions && npx typedoc --out ../docs/api/functions src/index.ts --tsconfig tsconfig.json --excludePrivate --excludeInternal --readme none) || {
              echo "::warning::TypeDoc failed — falling back to a stub"
              mkdir -p docs/api/functions
              echo "# functions API reference" > docs/api/functions/README.md
              echo "" >> docs/api/functions/README.md
              echo "TypeDoc generation failed. See CI log for details." >> docs/api/functions/README.md
            }
          fi

      # ── Lint markdown links ─────────────────────────────────────────────
      - name: Lint markdown links
        run: |
          npm install -g markdown-link-check@latest || true
          FAIL=0
          for f in README.md docs/*.md docs/**/*.md; do
            if [ -f "$f" ]; then
              echo "🔎 linting $f"
              markdown-link-check --quiet --alive 200,301,302,307,308 "$f" || echo "::warning file=$f::Potential dead link in $f"
            fi
          done
          echo "✅ Markdown link check completed."

      # ── Commit / push ───────────────────────────────────────────────────
      - name: Commit documentation changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md README.md docs/api/functions
          git commit -m "docs: Update docs for release ${{ github.event.release.tag_name || github.ref_name }}" || echo "No changes to commit"
          git push
