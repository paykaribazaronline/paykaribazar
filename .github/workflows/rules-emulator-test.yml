name: 🛡️ Firestore / Storage Rules Emulator Test

# Runs Firestore + Storage security rules tests against the local Firebase
# emulator on every PR (and on every push to main). The test suite lives
# under `test/firestore_rules/` and is plain `dart test`.
#
# If any rule test fails (e.g. a customer can read another customer's
# transactions, a reseller can write `wholesalePrice`), this workflow
# BLOCKS the PR from being merged.

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'pubspec.yaml'
      - 'test/firestore_rules/**'
      - '.github/workflows/rules-emulator-test.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'pubspec.yaml'
      - 'test/firestore_rules/**'
      - '.github/workflows/rules-emulator-test.yml'
  workflow_dispatch:

concurrency:
  group: rules-emulator-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'  # firebase-tools requires JDK 21+
  # Flutter 3.35.0 ships Dart 3.9 — required by shared_preferences ^2.5.5
  FLUTTER_VERSION: 'stable'  # channel: stable — always latest, provides Dart 3.10+

jobs:
  rules-emulator-test:
    name: 🛡️ Rules Emulator Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java (emulator)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Create dummy Firebase options
        run: bash .github/scripts/create_dummy_firebase_options.sh

      - name: Verify test/firestore_rules/ exists
        run: |
          if [ ! -d test/firestore_rules ]; then
            echo "::error::test/firestore_rules/ directory is missing — cannot run rules tests."
            exit 1
          fi
          echo "✅ test/firestore_rules/ found"

      - name: Run rules tests against the Firestore + Storage emulator (FATAL)
        run: |
          echo "🛡️  Booting Firestore + Storage emulators and running flutter test test/firestore_rules/ ..."
          # Use `flutter test` (not `dart test`) so the test package version is
          # the one pinned by flutter_test in the Flutter SDK — avoids analyzer
          # / matcher version-solving conflicts with hive_generator.
          firebase emulators:exec --only firestore,storage \
            "flutter test test/firestore_rules/ --reporter expanded"
        env:
          FIREBASE_CLI_PREVIEWS: storageEmulator

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-test-report
          path: |
            .dart_tool/test_results/
            firestore-debug.log
            storage-debug.log
          if-no-files-found: ignore
          retention-days: 14
