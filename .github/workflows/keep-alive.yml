name: "Keep-Alive — Render Backend"

# Periodically pings the Render backend health check to prevent the free-tier
# web service from sleeping after 15 minutes of inactivity.

on:
  schedule:
    # Runs every 10 minutes (cron format: minute hour day month day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: backend-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend
        run: |
          echo "📡 Pinging https://paykaribazar-backend.onrender.com/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://paykaribazar-backend.onrender.com/health)
          echo "HTTP response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is awake and healthy!"
          else
            echo "⚠ Unexpected status: $STATUS"
            # Retry once after 5 seconds in case of cold start
            sleep 5
            RETRY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://paykaribazar-backend.onrender.com/health)
            echo "Retry response status: $RETRY_STATUS"
          fi
